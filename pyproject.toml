[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr_diarization"
version = "0.0.1"
authors = [
  { name="Ulyana-Nagornaya", email="ulyana.nagornaya@gmail.com" },
]
description = "ASR and speaker diarization for Russian audio using Whisper and pyannote.audio"
requires-python = ">=3.9"
readme = "README.md"
requires-python = '>=3.10,<=3.14'
dependencies = [
    "openai-whisper>=20231117",        # large-v3-turbo
    "pyannote.audio>=3.1.0",           # speaker diarization
    "torch>=2.1.0",                    # pyannote требует >=2.1
    "torchaudio>=2.1.0",
    "ffmpeg-python>=0.2.0",            # конвертация MP4→WAV
    "librosa>=0.10.0",                 # альтернатива для загрузки аудио
]

[project.scripts]
asr = "asr_diarization:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",                     # линтер 
    "mypy>=1.5",                       # статическая типизация
    "jupyter>=1.0",                    # для notebooks/
    "ipywidgets>=8.0",                 # прогресс-бары в Colab
]

test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.ruff]
line-length = 120  # максимальная длина строки кода
target-version = 'py310'  # версия Python - позволяет Ruff игнорировать синтаксис, которого нет в этой версии
exclude = ['**/tests/**', '**/notebooks/**']  # папки или файлы, которые Ruff не будет проверять

[tool.ruff.format]
quote-style = 'single'  # форматер Ruff будет приводить строки к одинарным кавычкам '...' вместо двойных "..."

[tool.ruff.lint]
# все правила - https://docs.astral.sh/ruff/rules/
select = [
    'E', 'W',     # pycodestyle — must-have
    'F',          # pyflakes — must-have (unreachable code, unused vars)
    'I',          # isort — must-have (import sorting)
    'N',          # naming — полезно
    'Q',          # кавычки — ты уже настраиваешь
    'RET', 'SIM', # улучшения кода
    'ARG',        # неиспользуемые аргументы
    'RUF',        # полезные Ruff-specific фичи
]

ignore = [
    'D100',  # Необходимость документации для всех публичных модулей
    'D104',  # Необходимость документации для всех публичных пакетов
    'G004',  # Запрет на использование f-строк в логировании
    'RUF001', 'RUF002', 'RUF003',   # Запрет на использование неоднозначных символов в комментариях (конфликт с русским языком)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'  # линтер Ruff будет приводить строки к одинарным кавычкам '...' вместо двойных "..."