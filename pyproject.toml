[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [{ include = 'asr_diarization', from = 'src' }]

[project]
name = "asr_diarization"
version = "1.0.0"
description = "ASR and speaker diarization for Russian audio using Whisper and pyannote.audio"
readme = "README.md"
authors = ["Ulyana Nagornaya"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
openai-whisper = ">=20231117"      # large-v3-turbo
pyannote-audio = ">=3.1.0"         # speaker diarization
torch = ">=2.1.0"                  # pyannote требует >=2.1
torchaudio = ">=2.1.0"
ffmpeg-python = ">=0.2.0"          # конвертация MP4→WAV
librosa = ">=0.10.0"               # альтернатива для загрузки аудио

[tool.poetry.group.dev.dependencies] # --with dev
ruff = ">=0.1.0"                   # линтер 
mypy = ">=1.5"                     # статическая типизация
jupyter = ">=1.0"                  # для notebooks/

[tool.poetry.group.test.dependencies] #  --with test
pytest = ">=7.0"

[tool.ruff]
line-length = 120
target-version = 'py310'
exclude = ['**/tests/**', '**/notebooks/**']

[tool.ruff.format]
quote-style = 'single'  # форматер Ruff будет приводить строки к одинарным кавычкам '...' вместо двойных "..."

[tool.ruff.lint]
# все правила - https://docs.astral.sh/ruff/rules/
select = [
    'E',  # ошибки стиля кода по стандарту PEP8
    'F',  # статический анализ кода (Pyflakes), поиск логических ошибок (например, импортирован модуль, но не используется)
    'I',  # проверка сортировки и группировки импортов (через isort)
    'W',  # предупреждения PEP8, не критичные
    'C',  # контроль сложности функций
#    'T',  # проверка типов и аннотаций
#    'D',  # проверка документации
    'N',  # PEP8 naming convetions
    'G',  # flake8-logging-format
    'Q',  # flake8-quotes
    'RSE',  # flake8-raise
    'RET',  # flake8-return
    'SLF',  # flake8-self
    'SIM',  # flake8-simplify
    'TID',  # flake8-tidy-imports
    'TC',  # flake8-type-checking
    'INT',  # flake8-gettext
    'ARG',  # flake8-unused-arguments
    'PL',  # Pylint
    'NPY',  # NumPy-specific rules
    'FAST',  # FastAPI
    'RUF',  # Ruff-specific rules
]
ignore = [
    'D100',  # Необходимость документации для всех публичных модулей
    'D104',  # Необходимость документации для всех публичных пакетов
    'G004',  # Запрет на использование f-строк в логировании
    'RUF001', 'RUF002', 'RUF003',   # Запрет на использование неоднозначных символов в комментариях (конфликт с русским языком)
]

[tool.ruff.lint.pydocstyle]
convention = 'pep257'  # использовать стандарт PEP 257 для docstring

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'  # линтер Ruff будет приводить строки к одинарным кавычкам '...' вместо двойных "..."