[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "text-analyzer"
version = "1.0.0"
description = "Russian text analyzer with linguistic features"
authors = ["Ulyana Nagornaya"]
packages = [{ include = "text_analyzer", from = "src" }]


[tool.poetry.dependencies]
python = ">=3.10,<3.14"
spacy = ">=3.7.0"
pydantic = ">=2.0"
razdel = ">=0.5.0,<0.6.0"
ru-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.7.0/ru_core_news_lg-3.7.0-py3-none-any.whl" }

[tool.poetry.group.api.dependencies]
fastapi = ">=0.100"
uvicorn = { version = ">=0.23", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.1.0"
mypy = ">=1.5"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0"

[tool.ruff]
line-length = 120
target-version = 'py310'
exclude = ['**/tests/**', '**notebooks**']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = [
    'E', 'F', 'I', 'W', 'C',
    'N', 'G', 'Q', 'RSE', 'RET', 'SLF', 'SIM',
    'TID', 'TC', 'INT', 'ARG', 'PL', 'NPY',
    'FAST', 'RUF',
]
ignore = [
    'D100', 'D104',
    'G004',
    'RUF001', 'RUF002', 'RUF003',
]

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'